<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEQ-SA 晨型夜型测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}h1{font-size:28px;margin:10px 0}.intro{color:#667085;line-height:1.7}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#eef0ff;color:#5267ee;font-size:12px;font-weight:700}.sticky{position:sticky;top:0;z-index:3;background:rgba(245,247,251,.95);padding:12px 0}.track{height:7px;background:#e4e7ec;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#5267ee;transition:.2s}.counter{text-align:right;color:#667085;font-size:12px;margin-top:5px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:19px;margin:14px 0;box-shadow:0 4px 18px rgba(20,30,50,.04)}.meta{font-size:12px;font-weight:800;color:#5267ee;margin-bottom:8px}.q{font-size:17px;font-weight:700;line-height:1.55;margin-bottom:14px}.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #e2e6ed;border-radius:13px;padding:14px 13px;margin:9px 0;cursor:pointer}.opt.sel{border-color:#5267ee;background:#eef0ff}.opt input{margin-top:3px;accent-color:#5267ee}.btn{width:100%;border:0;border-radius:14px;padding:16px;background:#5267ee;color:white;font-size:16px;font-weight:800;cursor:pointer}.err{display:none;background:#fff0f0;color:#b42318;padding:12px;border-radius:12px;margin:12px 0}.result{display:none;text-align:center}.score{font-size:54px;font-weight:900;color:#5267ee}.type{font-size:23px;font-weight:900}.desc{color:#667085;line-height:1.7;margin:10px auto 18px}.ranges{text-align:left;background:#f8f9fc;border-radius:12px;padding:12px;font-size:13px;line-height:1.9}.reset{margin-top:10px;background:#e9ecf3;color:#344054}footer{color:#7b8495;font-size:11px;line-height:1.6;padding:22px 5px}</style></head><body><main class="wrap"><span class="badge">MEQ-SA · 19题</span><h1>你是清晨型，还是夜晚型？</h1><p class="intro">请按照过去几星期的真实感受作答。完成全部 19 题后，会自动计算你的 MEQ-SA 总分和昼夜节律类型。</p><div class="sticky"><div class="track"><div class="bar" id="bar"></div></div><div class="counter" id="counter">已完成 0 / 19</div></div><form id="quiz"></form><div class="err" id="err">还有题目没有作答，已定位到第一道未完成的题目。</div><button class="btn" type="button" id="submit">查看我的结果</button><section class="card result" id="result"><div>你的 MEQ-SA 总分</div><div class="score" id="score"></div><div class="type" id="type"></div><div class="desc" id="desc"></div><div class="ranges">16–30：绝对夜晚型<br>31–41：中度夜晚型<br>42–58：中间型<br>59–69：中度清晨型<br>70–86：绝对清晨型</div><button class="btn reset" type="button" id="reset">重新测试</button></section><footer>本页面为 MEQ-SA 简体中文版的交互式整理，仅用于自测与交流，不替代医学诊断。原始量表：Horne & Östberg (1976)。</footer></main><script>const Q=[["如果你能够完全自由地计划白天的时间，你希望大约在什么时间起床？",[["05:00–06:30",5],["06:30–07:45",4],["07:45–09:45",3],["09:45–11:00",2],["11:00–12:00",1]]],["如果你能够完全自由地计划夜晚，你希望大约在什么时间去睡觉？",[["20:00–21:00",5],["21:00–22:15",4],["22:15–00:30",3],["00:30–01:45",2],["01:45–03:00",1]]],["如果你要在早上的某个时刻起床，你会有多么依赖闹钟来唤醒你？",[["完全不依赖",4],["略为依赖",3],["比较依赖",2],["非常依赖",1]]],["在早上时，你有多容易起床？",[["非常困难",1],["比较困难",2],["一般容易",3],["非常容易",4]]],["早上起床后的半小时内，你有多精神？",[["完全不精神",1],["一点精神",2],["一般精神",3],["非常精神",4]]],["在起床后的半小时内，你感到有多肚饿？",[["完全不肚饿",1],["一点肚饿",2],["一般肚饿",3],["非常肚饿",4]]],["清晨起床后的半小时内，你的感觉如何？",[["非常疲倦",1],["稍为疲倦",2],["一般清醒",3],["非常清醒",4]]],["如果第二天没有任何约会，相比平时习惯的时间，你会选择什么时间去睡觉？",[["较平常推迟很少或从不推迟",4],["较平常推迟不到一小时",3],["较平常推迟 1–2 小时",2],["较平常推迟两小时以上",1]]],["假设你决定开始运动，每周两次、每次一小时，并安排在早上 7–8 点。只考虑自己的生理时钟，你认为表现会怎样？",[["很好",4],["一般好",3],["难以执行",2],["非常难以执行",1]]],["在夜晚你大约到什么时候会感到疲倦，而且需要睡觉？",[["20:00–21:00",5],["21:00–22:15",4],["22:15–00:45",3],["00:45–02:00",2],["02:00–03:00",1]]],["假设你希望在一项持续两小时、会令人精神疲累的测试中取得最佳表现，只考虑自己的生理时钟，你会选择哪个考试时段？",[["08:00–10:00",6],["11:00–13:00",4],["15:00–17:00",2],["19:00–21:00",0]]],["如果你要在晚上 11 点（23:00）睡觉，你会有多疲倦？",[["完全不疲倦",0],["小小疲倦",2],["一般疲倦",3],["非常疲倦",5]]],["假设你比平时迟几个小时睡觉，但第二天早上无需在特定时间起床，你最可能出现哪种情况？",[["按平常时间起床，而且不会再睡",4],["按平常时间起床，但感到昏昏欲睡",3],["按平常时间起床，然后再睡",2],["较平常时间迟起床",1]]],["假设你要值夜更，并需在清晨 4–6 点保持清醒，而第二天没有任何约会。哪种情况最适合你？",[["夜更结束后才睡",1],["夜更前片刻小睡，结束后再睡",2],["夜更前睡一觉，结束后再小睡",3],["只在夜更前睡一觉",4]]],["假设你需要进行两小时的艰巨体力工作，可以完全自由安排时间，只考虑自己的生理时钟，你会选择哪个时段？",[["08:00–10:00",4],["11:00–13:00",3],["15:00–17:00",2],["19:00–21:00",1]]],["假设你决定开始运动，每周两次、每次一小时，并安排在晚上 10–11 点。只考虑自己的生理时钟，你认为表现会怎样？",[["很好",1],["一般",2],["难以执行",3],["非常难以执行",4]]],["假设你可以选择自己的工作时间，每天只工作 5 小时（包括休息），工作有趣且酬金依据表现，你会选择哪一时段开始？",[["04:00–08:00 之间开始",5],["08:00–09:00 之间开始",4],["09:00–14:00 之间开始",3],["14:00–17:00 之间开始",2],["17:00–04:00 之间开始",1]]],["一天之中，以下哪个时段是你的最佳时间？",[["05:00–08:00",5],["08:00–10:00",4],["10:00–17:00",3],["17:00–22:00",2],["22:00–05:00",1]]],["人可分为“清晨型”和“夜晚型”，你认为自己属于哪一类型？",[["绝对清晨型",6],["清晨型多过夜晚型",4],["夜晚型多过清晨型",2],["绝对夜晚型",0]]]];const quiz=document.getElementById('quiz');Q.forEach((x,i)=>{const c=document.createElement('section');c.className='card';c.id='q'+i;c.innerHTML='<div class="meta">第 '+(i+1)+' 题 / 19</div><div class="q">'+x[0]+'</div>'+x[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+o[1]+'"><span>'+o[0]+'</span></label>').join('');quiz.appendChild(c)});function progress(){let n=0;for(let i=0;i<19;i++)if(document.querySelector('input[name="q'+i+'"]:checked'))n++;document.getElementById('bar').style.width=(n/19*100)+'%';document.getElementById('counter').textContent='已完成 '+n+' / 19'}quiz.addEventListener('change',e=>{if(e.target.type==='radio'){e.target.closest('.card').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));e.target.closest('.opt').classList.add('sel');progress()}});document.getElementById('submit').onclick=()=>{let score=0,first=-1;for(let i=0;i<19;i++){let a=document.querySelector('input[name="q'+i+'"]:checked');if(!a&&first<0)first=i;if(a)score+=+a.value}if(first>=0){document.getElementById('err').style.display='block';document.getElementById('q'+first).scrollIntoView({behavior:'smooth'});return}document.getElementById('err').style.display='none';let t,d;if(score<=30){t='绝对夜晚型';d='你的自然节律明显偏晚，通常更适应较晚入睡和较晚起床。'}else if(score<=41){t='中度夜晚型';d='你的昼夜节律偏向夜晚，晚间通常更容易进入状态。'}else if(score<=58){t='中间型';d='你的昼夜节律相对均衡，对较早或较晚的作息都有一定适应性。'}else if(score<=69){t='中度清晨型';d='你的昼夜节律偏向清晨，通常较早进入清醒和高效状态。'}else{t='绝对清晨型';d='你的自然节律明显偏早，通常更适应早睡早起。'}document.getElementById('score').textContent=score;document.getElementById('type').textContent=t;document.getElementById('desc').textContent=d;document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'})};document.getElementById('reset').onclick=()=>{quiz.reset();document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));document.getElementById('result').style.display='none';progress();scrollTo({top:0,behavior:'smooth'})}</script></body></html>
